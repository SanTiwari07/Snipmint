[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snipmint"
version = "0.1.0.dev0"
description = "Paste a YouTube link, get vertical shorts with word-by-word captions. Free local analysis by default, Gemini as an optional upgrade. Local and open source."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SanTiwari07 and Snipmint contributors" }]
keywords = ["shorts", "reels", "clips", "youtube", "captions", "video", "gemini", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "edge-tts>=7.2",
    "fonttools>=4.50",
    "numpy>=1.24",
    "pillow>=10",
    "pydantic>=2.6",
    "typer>=0.12",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
offline = ["kokoro-onnx>=0.6"]
align = ["faster-whisper>=1.1"]
# transcription of the source video (same package as align, named for what Snipmint uses it for)
transcribe = ["faster-whisper>=1.1"]
# camera-cut detection used to snap and score clips
scenes = ["scenedetect>=0.6.4", "opencv-python-headless>=4.9"]
# speaker tracking for the vertical crop
reframe = ["mediapipe>=0.10.14", "opencv-python-headless>=4.9"]
# Advanced AI mode (optional; needs a Gemini API key)
gemini = ["google-genai>=1.0"]
# setuptools<81: resemble-perth (a Chatterbox dependency) imports pkg_resources, which newer setuptools dropped
clone = ["chatterbox-tts>=0.1.7", "setuptools<81"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "pip-licenses",
    "httpx>=0.27",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "sse-starlette>=2",
    "jsonschema>=4",
]

[project.urls]
Homepage = "https://github.com/SanTiwari07/Snipmint"
Repository = "https://github.com/SanTiwari07/Snipmint"
Issues = "https://github.com/SanTiwari07/Snipmint/issues"

[project.scripts]
snipmint = "snipmint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["snipmint"]
# the built web app is git-ignored but must ship in the wheel
artifacts = ["snipmint/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["snipmint", "README.md", "LICENSE", "THIRD_PARTY_LICENSES.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # B008: typer defaults; E501: long user-facing messages

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet (Edge TTS)",
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "slow: slow test",
    "models: needs downloaded ML models / optional extras",
]
addopts = "-ra"
